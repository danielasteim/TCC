# Configuração única dos experimentos do TCC.
# Todos os scripts em trabalho_f/scripts/ leem este arquivo via common_f.py.
# Caminhos relativos à pasta do TCC.

semente: 42

caminhos:
  humanos: captcha_data_f               # sessões humanas do coletor v3 (somente leitura)
  humanos_v1: captcha_data              # coletor v1 (erro de coordenadas), só referência
  bots_trajetorias: trabalho_f/dados/bot/trajetorias
  bots_sessoes: trabalho_f/dados/bot/sessoes
  resultados: trabalho_f/resultados
  tabelas: trabalho_f/resultados/tabelas
  figuras: trabalho_f/resultados/figuras
  modelos: trabalho_f/modelos
  selecao_humanos: trabalho_f/resultados/selecao_humanos.csv

# Pré-processamento e modelos (iguais aos do training.py)
winsorizacao: [0.005, 0.995]
k_folds: 5
svm:
  kernel: rbf
  nu: 0.05
  gamma: auto
floresta:
  n_estimators: 250
  max_samples: 1.0
  contamination: auto

# Estimação dos parâmetros nos humanos (00_estimar_parametros_f.py)
estimacao:
  L_minimo_ajuste: 50        # px; trajetórias mais curtas não entram no ajuste das formas
  n_direcoes: 8              # setores de direção para M (como em Acien et al., 2022)
  n_faixas_L: 3              # faixas de comprimento (tercis) para M
  n_minimo_celula: 30        # abaixo disso, a célula usa a estatística da direção inteira
  grade_b: [-10.0, 10.0, 0.25] # |b| limitado: valores no limite = desvio concentrado num extremo
  percentis_parametros: [5, 95]

# Gerador de trajetórias (01_gerar_trajetorias_f.py)
gerador:
  trajetorias_por_familia: 150
  M_minimo: 10
  tentativas_por_trajetoria: 50   # reamostra se a trajetória sair da tela

# Bot de replay (semana 2)
replay:
  dt_T0_ms: 8

# Seleção das sessões humanas (selecionar_sessoes_f.py)
# Computador principal: notebook Linux (onde o bot de replay também roda)
selecao:
  largura: 1366
  altura: 768
  dpi: null              # o coletor só lê a escala de DPI no Windows
  pausa_ms: 100
  duracao_max_s: 5.0
  eventos_min: 10
